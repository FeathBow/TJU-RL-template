name: LaTeX CI

on:
  push:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.cls'
      - '.github/workflows/latex-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.tex'
      - '**.cls'

jobs:
  lint:
    name: Lint LaTeX Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install chktex
        run: sudo apt-get update && sudo apt-get install -y chktex

      - name: Run chktex on main.tex
        run: chktex -q main.tex || exit 0

      - name: Run chktex on TJUletter.cls
        run: chktex -q TJUletter.cls || exit 0

  build:
    name: Build PDF
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for reproducible builds

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: true
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
          retention-days: 7
